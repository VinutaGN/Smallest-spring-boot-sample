apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-microservice
  namespace: spring-boot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-boot-microservice
  template:
    metadata:
      labels:
        app: spring-boot-microservice
    spec:
      containers:
        - name: spring-boot-microservice
          image: vinutagn/spring-boot-microservice:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-service
  namespace: spring-boot-app
spec:
  type: NodePort
  selector:
    app: spring-boot-microservice
  ports:
    - port: 8011
      targetPort: 8080
      nodePort: 30687
