pipeline:
  stages:
    - steps:
        - run:
            script: mvn -f /harness/SmallestSpringApp/pom.xml clean package
            container:
              image: maven:3.9-eclipse-temurin-17
              connector: dockerhub_connector
          name: Build_Application
          id: Build_Application
      name: Build_and_Test
      id: Build_and_Test
      clone:
        ref:
          type: branch
          name: master
        enabled: true
        repo: VinutaGN/Smallest-spring-boot-sample
        connector: github_conncetor_emp
    - id: Build_and_Push_Docker_Image
      name: Build_and_Push_Docker_Image.
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: mvn -f SmallestSpringApp/pom.xml clean package
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              set -eu
              mvn -B test -Dmaven.build.cache.skipCache=true
              mvn -B jacoco:report || echo "JaCoCo is not configured; skipping coverage report generation."
            intelligence:
              disabled: true
        - id: coverage
          name: Upload Coverage
          run:
            shell: bash
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
        - name: Build_and_Push_Image
          id: Build_and_Push_Image
          build:
            uses: buildAndPushToDocker
            with:
              connector: dockerhub_connector
              repo: docker.io/vinutagn
              tags:
                - latest
              caching: true
              dockerfile: SmallestSpringApp/Dockerfile
              context: SmallestSpringApp
